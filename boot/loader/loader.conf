# A glob pattern to select the default entry by id.
default @saved

# How long the boot menu should be shown before the default entry is booted.
timeout 10

# This option configures the resolution of the console.
# console-mode keep

# Enable or disable the editor.
editor no

# Enable or disable entries for other boot entries found on the boot partition.
# auto-entries yes

# A boolean controlling the presence of the "Reboot Into Firmware Interface" entry.
# auto-firmware yes

# A boolean controlling the presence of the "Reboot the System" entry.
auto-reboot yes

# A boolean controlling the presence of the "Power Off The System" entry.
auto-poweroff yes

# Beep n times when n-th entry in boot menu is selected.
# beep no

# Enrollment of secure boot keys found on the ESP if the system is in setup mode.
# secure-boot-enroll if-safe

# Action to take after the automatic enrollment of secure boot keys is completed.
# secure-boot-enroll-action reboot

# How long the warning should be shown in seconds before the key enrollment process starts.
# secure-boot-enroll-timeout-sec 15

# Try to detect BitLocker encrypted drives along with an active TPM.
# reboot-for-bitlocker no

# Auto reboot in case the selected entry fails to start.
# reboot-on-error auto

# The log level used by systemd-boot(7).
# log-level info
