# Set the amount of time a key must be held before it starts repeating.
input type:keyboard repeat_delay 300

# Set the frequency of key repeats once the repeat_delay has passed.
input type:keyboard repeat_rate 25

# Set the layout of the keyboard.
input type:keyboard xkb_layout tr,us

# Set extra xkb configuration options for the keyboard.
input type:keyboard xkb_options compose:ins,grp:alt_space_toggle

# Initially enable or disable Caps Lock on startup.
input type:keyboard xkb_capslock disabled

# Initially enable or disable Num Lock on startup.
input type:keyboard xkb_numlock enabled
