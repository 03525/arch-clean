# The window that has focus.
client.focused #2F4F4FFF #2F4F4FFF #000000FF #006666FF #2F4F4FFF

# The most recently focused window within a container which is not focused.
client.focused_inactive #333333FF #333333FF #000000FF #333333FF #333333FF

# A window that has focused descendant container.
client.focused_tab_title #006666FF #006666FF #000000FF

# A window that does not have focus.
client.unfocused #333333FF #333333FF #000000FF #333333FF #333333FF

# A window with an urgency hint.
client.urgent #FF0000FF #FF0000FF #000000FF #FF0000FF #FF0000FF

# Set default border style for new tiled windows.
default_border pixel 5

# Set default border style for new floating windows.
default_floating_border pixel 5

# If set to yes, moving your mouse over a window will focus that window.
focus_follows_mouse no

# Set font to use for the title bars.
font pango:JetBrains Mono NL 10

# Thickness of the title bar border in pixels.
titlebar_border_thickness 0

# Padding of the text in the title bar.
titlebar_padding 5
