# The preferred color scheme for the user interface.
exec gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"

# Whether the cursor should blink.
exec gsettings set org.gnome.desktop.interface cursor-blink false

# The type of antialiasing to use when rendering fonts.
exec gsettings set org.gnome.desktop.interface font-antialiasing "grayscale"

# The type of hinting to use when rendering fonts.
exec gsettings set org.gnome.desktop.interface font-hinting "slight"

# Name of the default font used by gtk+.
exec gsettings set org.gnome.desktop.interface font-name "Noto Sans 12"

# Preference to indicate whether font rendering should follow the low-level settings.
exec gsettings set org.gnome.desktop.interface font-rendering "manual"

# Basename of the default theme used by gtk+.
exec gsettings set org.gnome.desktop.interface gtk-theme "Breeze-Dark"

# Icon theme to use for the panel, nautilus etc.
exec gsettings set org.gnome.desktop.interface icon-theme "Papirus-Dark"

# Whether to play sounds on user events.
exec gsettings set org.gnome.desktop.sound event-sounds true

# Whether to play sounds on input events.
exec gsettings set org.gnome.desktop.sound input-feedback-sounds true

# The amount of detail to show in the "Modified" column.
exec gsettings set org.gtk.Settings.FileChooser date-format "with-time"

# If set to true, then folders are shown before files in the list.
exec gsettings set org.gtk.Settings.FileChooser sort-directories-first true

# Either "recent" or "cwd".
exec gsettings set org.gtk.Settings.FileChooser startup-mode "cwd"

# Different ways to show the "Type" column information.
exec gsettings set org.gtk.Settings.FileChooser type-format "mime"
