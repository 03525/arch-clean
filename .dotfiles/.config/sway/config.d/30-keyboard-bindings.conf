floating_modifier Mod4

bindsym --to-code {
    --no-repeat XF86AudioMicMute exec bash center mike t
}

bindcode {
    --no-repeat 121 exec bash center volume t
    --no-repeat 122 exec bash center volume d
    --no-repeat 123 exec bash center volume i
}

bindcode {
    --no-repeat Mod4+53 exec bash center menu
}

bindcode {
    --no-repeat Mod4+26 exec thunar
    --no-repeat Mod4+36 exec alacritty
    --no-repeat Mod4+46 exec loginctl lock-session
}

bindsym --to-code {
    --no-repeat Print exec flameshot gui
    --no-repeat Mod4+Print exec flameshot launcher
}

bindsym --to-code {
    --no-repeat Mod4+h splith
    --no-repeat Mod4+v splitv
}

bindsym --to-code {
    --no-repeat Mod4+f fullscreen toggle
}

bindsym --to-code {
    --no-repeat Mod4+space focus mode_toggle
    --no-repeat Mod4+Shift+space floating toggle
}

bindsym --to-code {
    --no-repeat Mod4+t layout tabbed
    --no-repeat Mod4+s layout stacking
    --no-repeat Mod4+n layout toggle split
}

bindsym --to-code {
    --no-repeat Mod4+p focus parent
    --no-repeat Mod4+c focus child
}

bindcode {
    --no-repeat Mod4+111 focus up
    --no-repeat Mod4+113 focus left
    --no-repeat Mod4+114 focus right
    --no-repeat Mod4+116 focus down
}

bindcode {
    --no-repeat Mod4+Shift+111 move up 50 px
    --no-repeat Mod4+Shift+113 move left 50 px
    --no-repeat Mod4+Shift+114 move right 50 px
    --no-repeat Mod4+Shift+116 move down 50 px
}

bindcode {
    --no-repeat Mod4+Control+111 resize grow height 50 px
    --no-repeat Mod4+Control+113 resize shrink width 50 px
    --no-repeat Mod4+Control+114 resize grow width 50 px
    --no-repeat Mod4+Control+116 resize shrink height 50 px
}

bindsym --to-code {
    --no-repeat Mod4+1 workspace 1
    --no-repeat Mod4+2 workspace 2
    --no-repeat Mod4+3 workspace 3
    --no-repeat Mod4+4 workspace 4
    --no-repeat Mod4+5 workspace 5
    --no-repeat Mod4+6 workspace 6
    --no-repeat Mod4+7 workspace 7
    --no-repeat Mod4+8 workspace 8
    --no-repeat Mod4+9 workspace 9
}

bindsym --to-code {
    --no-repeat Mod4+Shift+1 move workspace 1
    --no-repeat Mod4+Shift+2 move workspace 2
    --no-repeat Mod4+Shift+3 move workspace 3
    --no-repeat Mod4+Shift+4 move workspace 4
    --no-repeat Mod4+Shift+5 move workspace 5
    --no-repeat Mod4+Shift+6 move workspace 6
    --no-repeat Mod4+Shift+7 move workspace 7
    --no-repeat Mod4+Shift+8 move workspace 8
    --no-repeat Mod4+Shift+9 move workspace 9
}

bindsym --to-code {
    --no-repeat Mod4+minus scratchpad show
    --no-repeat Mod4+Shift+minus move scratchpad
}

bindsym --to-code {
    --no-repeat Mod4+Shift+r reload
    --no-repeat Mod4+Shift+Escape exit
}

bindsym --to-code {
    --no-repeat Mod4+q kill
}
