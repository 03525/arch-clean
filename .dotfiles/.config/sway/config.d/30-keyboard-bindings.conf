floating_modifier Mod4

# Executing applications
bindsym --to-code --no-repeat Mod4+e exec thunar
bindsym --to-code --no-repeat Mod4+Return exec alacritty
bindsym --to-code --no-repeat Mod4+l exec loginctl lock-session
bindsym --to-code --no-repeat Mod4+x exec bash center menu
bindsym --to-code --no-repeat Mod4+Print exec flameshot gui
bindsym --to-code --no-repeat XF86AudioMute exec bash center volume t
bindsym --to-code --no-repeat XF86AudioLowerVolume exec bash center volume d
bindsym --to-code --no-repeat XF86AudioRaiseVolume exec bash center volume i

# Splitting containers
bindsym --to-code --no-repeat Mod4+h splith
bindsym --to-code --no-repeat Mod4+v splitv

# Manipulating layout
bindsym --to-code --no-repeat Mod4+f fullscreen toggle
bindsym --to-code --no-repeat Mod4+Shift+space floating toggle
bindsym --to-code --no-repeat Mod4+t layout tabbed
bindsym --to-code --no-repeat Mod4+s layout stacking
bindsym --to-code --no-repeat Mod4+n layout toggle split

# Focusing containers
bindsym --to-code --no-repeat Mod4+space focus mode_toggle
bindsym --to-code --no-repeat Mod4+p focus parent
bindsym --to-code --no-repeat Mod4+c focus child
bindsym --to-code --no-repeat Mod4+Up focus up
bindsym --to-code --no-repeat Mod4+Left focus left
bindsym --to-code --no-repeat Mod4+Right focus right
bindsym --to-code --no-repeat Mod4+Down focus down

# Moving containers
bindsym --to-code --no-repeat Mod4+Shift+Up move up 50 px
bindsym --to-code --no-repeat Mod4+Shift+Left move left 50 px
bindsym --to-code --no-repeat Mod4+Shift+Right move right 50 px
bindsym --to-code --no-repeat Mod4+Shift+Down move down 50 px

# Changing workspaces
bindsym --to-code --no-repeat Mod4+1 workspace 1
bindsym --to-code --no-repeat Mod4+2 workspace 2
bindsym --to-code --no-repeat Mod4+3 workspace 3
bindsym --to-code --no-repeat Mod4+4 workspace 4
bindsym --to-code --no-repeat Mod4+5 workspace 5
bindsym --to-code --no-repeat Mod4+6 workspace 6
bindsym --to-code --no-repeat Mod4+7 workspace 7
bindsym --to-code --no-repeat Mod4+8 workspace 8
bindsym --to-code --no-repeat Mod4+9 workspace 9

# Moving to workspaces
bindsym --to-code --no-repeat Mod4+Shift+1 move workspace 1
bindsym --to-code --no-repeat Mod4+Shift+2 move workspace 2
bindsym --to-code --no-repeat Mod4+Shift+3 move workspace 3
bindsym --to-code --no-repeat Mod4+Shift+4 move workspace 4
bindsym --to-code --no-repeat Mod4+Shift+5 move workspace 5
bindsym --to-code --no-repeat Mod4+Shift+6 move workspace 6
bindsym --to-code --no-repeat Mod4+Shift+7 move workspace 7
bindsym --to-code --no-repeat Mod4+Shift+8 move workspace 8
bindsym --to-code --no-repeat Mod4+Shift+9 move workspace 9

# Resizing containers
bindsym --to-code --no-repeat Mod4+Control+Up resize grow height 50 px
bindsym --to-code --no-repeat Mod4+Control+Left resize shrink width 50 px
bindsym --to-code --no-repeat Mod4+Control+Right resize grow width 50 px
bindsym --to-code --no-repeat Mod4+Control+Down resize shrink height 50 px

# Reloading/Exiting
bindsym --to-code --no-repeat Mod4+Shift+r reload
bindsym --to-code --no-repeat Mod4+Shift+Escape exit

# Scratchpad
bindsym --to-code --no-repeat Mod4+minus scratchpad show
bindsym --to-code --no-repeat Mod4+Shift+minus move scratchpad

# Closing windows
bindsym --to-code --no-repeat Mod4+q kill
