# Change the click method for the specified device.
input type:touchpad click_method button_areas

# Enable or disable tap-and-drag for the specified input device.
input type:touchpad drag enabled

# Enable or disable drag lock for the specified input device.
input type:touchpad drag_lock disabled

# Enable or disable inverted scrolling for the specified input device.
input type:touchpad natural_scroll enabled

# Change the scroll method for the specified input device.
input type:touchpad scroll_method two_finger

# Enable or disable tap for the specified input device.
input type:touchpad tap enabled
