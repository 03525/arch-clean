bar {
    # Set the ID of the bar.
    id bar

    # Execute custom bar command.
    # swaybar_command swaybar

    # Execute command when the mouse button has been pressed.
    bindsym button1 nop
    bindsym button2 nop
    bindsym button3 nop
    bindsym button4 nop
    bindsym button5 nop
    bindsym button6 nop
    bindsym button7 nop
    bindsym button8 nop
    bindsym button9 nop

    # Enable or disable binding mode indicator.
    # binding_mode_indicator yes

    # Specify the font to be used in the bar.
    font pango:Jetbrains Mono NL 10

    # Set the gaps from the edge of the screen for the bar.
    gaps 0

    # Set the height of the bar.
    height 50

    # Specify the behaviour of the bar when it is in hide mode.
    # hidden_state hide

    # Specify the visibility of the bar.
    # mode dock

    # Specify the modifier key that shows a hidden bar.
    modifier none

    # Restrict the bar to a certain output.
    # output *

    # Enable or disable pango markup for status lines.
    pango_markup enabled

    # Set position of the bar.
    position top

    # Specify the separator symbol to separate blocks on the bar.
    separator_symbol "|"

    # Execute the bar status command with sh -c.
    status_command bash "$XDG_CONFIG_HOME"/sway/scripts/status.sh

    # Set the padding that is used when the status line is at the right edge of the bar.
    status_edge_padding 0

    # Set the vertical padding that is used for the status line.
    status_padding 0

    # If set to yes, then workspace names will be omitted from the workspace button.
    # strip_workspace_name no

    # If set to yes, then workspace numbers will be omitted from the workspace button.
    # strip_workspace_numbers no

    # Enable or disable wrapping when scrolling through workspaces with the scroll wheel.
    # wrap_scroll no

    # Enable or disable workspace buttons on the bar.
    # workspace_buttons yes

    # Specify the minimum width for the workspace buttons on the bar.
    workspace_min_width 50 px

    # Execute the action when the mouse button has been pressed.
    tray_bindsym button1 Activate
    tray_bindsym button2 SecondaryActivate
    tray_bindsym button3 ContextMenu
    tray_bindsym button4 nop
    tray_bindsym button5 nop
    tray_bindsym button6 nop
    tray_bindsym button7 nop
    tray_bindsym button8 nop
    tray_bindsym button9 nop

    # Set the pixel padding of the system tray.
    tray_padding 0 px

    # Restrict the tray to a certain output.
    # tray_output *

    # Set the icon theme that sway will look for item icons in.
    icon_theme "Papirus-Dark"

    colors {
        # Background color of the bar.
        background #000000FF

        # Text color to be used for the status line.
        statusline #F5F5DCFF

        # Text color to be used for the separator.
        separator #333333FF

        # Background color of the bar on the currently focused monitor output.
        focused_background #000000FF

        # Text color to be used for the status line on the currently focused monitor output.
        focused_statusline #F5F5DCFF

        # Text color to be used for the separator on the currently focused monitor output.
        focused_separator #333333FF

        # Border, background and text color for a workspace button when the workspace has focus.
        focused_workspace #2F4F4FFF #2F4F4FFF #000000FF

        # Border, background and text color for a workspace button when the workspace is visible on some output, but the focus is on another one.
        active_workspace #000000FF #000000FF #F5F5DCFF

        # Border, background and text color for a workspace button when the workspace does not have focus and is not visible on any output.
        inactive_workspace #000000FF #000000FF #F5F5DCFF

        # Border, background and text color for a workspace button when the workspace contains a window with the urgency hint set.
        urgent_workspace #FF0000FF #FF0000FF #000000FF

        # Border, background and text color for the binding mode indicator.
        binding_mode #006666FF #006666FF #000000FF
    }
}
