# fullscreen
f cycle fullscreen
ESC set fullscreen no
MBTN_LEFT_DBL cycle fullscreen

# mute
m cycle mute

# pause
SPACE cycle pause; show-progress
MBTN_MID cycle pause; show-progress

# playlist
n playlist-next
p playlist-prev

# quit
q quit

# script: stats
h script-binding stats/display-page-4-toggle

# seek
LEFT seek -5 exact
RIGHT seek 5 exact

# volume
UP add volume 5
DOWN add volume -5
