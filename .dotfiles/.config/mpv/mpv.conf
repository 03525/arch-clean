# Restore playback position from the watch_later configuration subdirectory.
resume-playback=no

# Set the startup volume.
volume=100

# Set the maximum amplification level in percent.
volume-max=100

# Specify font to use for subtitles that do not themselves specify a particular font.
sub-font=Noto Sans

# Specify the sub font size.
# sub-font-size=38

# Do not terminate when playing or seeking beyond the end of the file.
keep-open=always

# If the current file is an image, play the image for the given amount of seconds.
image-display-duration=inf

# Play video with window border and decorations.
# border=yes

# Make mouse cursor automatically hide after given number of milliseconds.
cursor-autohide=2000

# Enable default-level key bindings.
input-default-bindings=no

# Enable loading of built-in key bindings during startup.
input-builtin-bindings=no

# Enable the built-in window-dragging behavior.
input-builtin-dragging=no

# Whether to load the on-screen-controller.
osc=no

# Enable display of the OSD bar.
# osd-bar=yes

# Set what is displayed on the OSD during seeks.
osd-on-seek=msg-bar

# Set the duration of the OSD messages in ms.
osd-duration=2000

# Specify font to use for OSD.
osd-font=Noto Sans

# Specify the OSD font size.
# osd-font-size=30

# Show a message on OSD when playback starts.
osd-playing-msg=${filename}

# Position of the OSD bar.
osd-bar-align-x=0

# Position of the OSD bar.
osd-bar-align-y=0

# Width of the OSD bar.
osd-bar-w=50

# Height of the OSD bar.
osd-bar-h=5

# Size of the outline of the OSD bar in scaled pixels.
# osd-bar-outline-size=0.5

# Set the OSD bar marker style.
osd-bar-marker-style=none

# Left and right screen margin for the OSD in scaled pixels.
osd-margin-x=10

# Top and bottom screen margin for the OSD in scaled pixels.
osd-margin-y=10

# Control to which corner of the screen OSD should be aligned to.
# osd-align-x=left

# Vertical position.
# osd-align-y=top

# Control verbosity directly for each module.
msg-level=input=error
