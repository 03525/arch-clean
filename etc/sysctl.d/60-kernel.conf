# When set to a non-zero value, a kernel panic will be triggered if the number of hung tasks found during a single scan reaches this value.
kernel.hung_task_panic=0

# When a task in D state did not get scheduled for more than this value report a warning.
kernel.hung_task_timeout_secs=120

# If positive, the kernel will reboot after the corresponding number of seconds.
kernel.panic=0

# It is a "magical" key combo you can hit which the kernel will respond to regardless of whatever else it is doing.
kernel.sysrq=0
